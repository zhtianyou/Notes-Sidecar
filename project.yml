name: NotesSidecar
options:
  bundleIdPrefix: com.youwin
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

configs:
  Debug: debug
  Release: release

targets:
  NotesSidecar:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Resources/NotesSidecar.Release.entitlements"
          - "Resources/Info-Release.plist"
          - "ShareExtension"
      - path: Sources/NotesSidecarCore
    resources:
      - path: App/Resources/Assets.xcassets
      - path: App/Resources/en.lproj/Localizable.strings
      - path: App/Resources/zh-Hans.lproj/Localizable.strings
    info:
      path: App/Resources/Info.plist
      properties:
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSAppleEventsUsageDescription: Notes Sidecar 需要读取你在“备忘录”中当前选中的笔记，并在你确认后将回答追加回该笔记。
    entitlements:
      path: App/Resources/NotesSidecar.Debug.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youwin.NotesSidecar
        CODE_SIGN_ENTITLEMENTS: App/Resources/NotesSidecar.Debug.entitlements
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        Release:
          CODE_SIGN_ENTITLEMENTS: App/Resources/NotesSidecar.Release.entitlements
          ENABLE_APP_SANDBOX: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
          SWIFT_OPTIMIZATION_LEVEL: "-O"
    dependencies:
      - target: NotesSidecarShare
        embed: true
      - sdk: AppKit.framework
      - sdk: SwiftUI.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: ApplicationServices.framework
      - sdk: Vision.framework
      - sdk: Speech.framework
      - sdk: ServiceManagement.framework
      - sdk: AVFoundation.framework
      - sdk: CryptoKit.framework
      - sdk: OSLog.framework
      - sdk: Carbon.framework
      - sdk: Network.framework
    scheme:
      testTargets:
        - NotesSidecarCoreTests
      gatherCoverageData: true

  NotesSidecarShare:
    type: app-extension
    platform: macOS
    sources:
      - path: App/ShareExtension
    info:
      path: App/ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: 发送到 Notes Sidecar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationDictionaryVersion: 2
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: App/ShareExtension/NotesSidecarShare.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - group.com.youwin.NotesSidecar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youwin.NotesSidecar.ShareExtension
        CODE_SIGN_IDENTITY: "-"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  NotesSidecarCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NotesSidecarCoreTests
    dependencies:
      - target: NotesSidecar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.youwin.NotesSidecarCoreTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_OBJC_BRIDGING_HEADER: ""
        OTHER_SWIFT_FLAGS: "-DNOTES_SIDECAR_CORE_TESTS"
